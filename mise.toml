[settings]
env_shell_expand = true

[tools]
hk = "latest"
pkl = "latest"
shellcheck = "latest"
shfmt = "latest"
oxfmt = "latest"
shellharden = "latest"
just = "latest"

[env]
REPO = "{{ config_root | absolute }}"
REPO_NAME = "{{ config_root | basename }}"

HOST_SSH = "ssh chris@192.168.1.32"
HOST_REPO = "/users/chris/unattend"

[tasks.fix]
alias = "f"
description = "run project formatters declared in hk.pkl in 'fix' mode"
run = "hk fix --all"

[tasks.check]
alias = "c"
description = "run project linters declared in hk.pkl in 'check' mode"
run = "hk check --all"

[tasks.sync]
alias = 's'
description = "git: sync local changes to remote"
usage = 'arg "<msg>" default="sync"'
run = 'git add -A && git commit -am "{{usage.msg}}" && git pull && git push'
